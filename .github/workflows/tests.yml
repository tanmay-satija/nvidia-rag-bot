name: Tests
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install fastapi==0.115.0 httpx==0.27.2 python-dotenv==1.0.1 groq==0.11.0 numpy==1.26.4
      - run: python -m unittest discover -s tests -v
